name: Automated API tests using Newman

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Run API tests via Newman
        run: |
          newman run "2474802010414_VoThanhTrung_ReqRes..postman_collection.json" \
            -e "2474802010414_VoThanhTrung_ReqRes_ENV.postman_environment.json" \
            -d users.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: report.html
