name: API Monitor and Performance Check

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ một lần
  workflow_dispatch:     # Cho phép chạy thủ công bằng nút bấm trên giao diện GitHub

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman CLI
        run: |
          npm install -g newman

      - name: Run API Monitor Script
        run: |
          newman run monitor-collection.json
